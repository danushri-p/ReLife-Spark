# Netlify build settings for the ReLife-Spark frontend (the React app in /client).
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# Send every page (e.g. /analysis, /profile) to the React app, so refreshing a page doesn't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
